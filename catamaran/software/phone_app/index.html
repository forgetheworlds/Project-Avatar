<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0a1628">
  <title>Catamaran Control</title>
  <link rel="manifest" href="manifest.json">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, system-ui, sans-serif;
      background: #0a1628; color: #e0e8f0;
      overflow: hidden; height: 100vh; width: 100vw;
      touch-action: none; user-select: none;
    }
    #cam-feed { position: fixed; top: 0; left: 0; right: 0; height: 55vh; background: #000; }
    #cam-feed img { width: 100%; height: 100%; object-fit: cover; }
    #overlay {
      position: absolute; top: 0; left: 0; right: 0;
      padding: 10px 14px;
      background: linear-gradient(180deg, rgba(0,0,0,0.7), transparent);
      display: flex; justify-content: space-between; align-items: center;
      pointer-events: none;
    }
    #status { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: #f44; }
    #status.ok { background: #4f4; }
    .hud { display: flex; gap: 8px; font: 11px monospace; }
    .hud-item { background: rgba(0,0,0,0.5); padding: 3px 6px; border-radius: 4px; }
    .hud-label { color: #6a7a8a; font-size: 8px; text-transform: uppercase; }

    #controls {
      position: fixed; bottom: 0; left: 0; right: 0;
      height: 45vh; display: flex; padding: 12px 16px 24px; gap: 12px;
    }
    #joy-area { flex: 1; max-width: 45%; position: relative; }
    #joy-base {
      width: 100%; height: 100%;
      background: rgba(255,255,255,0.06);
      border: 2px solid rgba(0,212,255,0.3);
      border-radius: 20px; position: relative; touch-action: none;
    }
    #joy-knob {
      width: 50px; height: 50px;
      background: radial-gradient(circle, #00d4ff, #0088aa);
      border-radius: 50%; position: absolute;
      top: 50%; left: 50%; transform: translate(-50%,-50%);
      pointer-events: none; box-shadow: 0 0 20px rgba(0,212,255,0.3);
    }
    #actions { flex: 1; display: flex; flex-direction: column; gap: 10px; }
    .btn {
      flex: 1; display: flex; align-items: center; justify-content: center;
      border: none; border-radius: 16px; font-size: 16px; font-weight: 700;
      color: #fff; touch-action: none; text-transform: uppercase; letter-spacing: 1px;
    }
    #fire-btn { background: linear-gradient(135deg, #f46, #c03); }
    #fire-btn.on { filter: brightness(1.3); }
    #rtb-btn { background: linear-gradient(135deg, #fa0, #c80); font-size: 13px; }

    #connect {
      position: fixed; inset: 0; background: rgba(0,0,0,0.9);
      display: flex; align-items: center; justify-content: center; z-index: 100;
    }
    #connect-box {
      background: #141e33; padding: 28px; border-radius: 16px;
      max-width: 300px; width: 90%; text-align: center;
    }
    #connect-box h2 { color: #00d4ff; margin-bottom: 16px; }
    #connect-box input {
      width: 100%; padding: 10px; margin: 10px 0; border-radius: 8px;
      border: 1px solid rgba(0,212,255,0.3); background: #0a1628;
      color: #fff; font-size: 16px; text-align: center;
    }
    #connect-box button {
      width: 100%; padding: 12px; border-radius: 8px;
      border: none; font-size: 16px; font-weight: 700; cursor: pointer;
    }
    #connect-box .primary { background: #00d4ff; color: #000; }
    #connect-box .secondary { background: transparent; border: 1px solid rgba(0,212,255,0.3); color: #e0e8f0; margin-top: 8px; }
  </style>
</head>
<body>
  <div id="cam-feed">
    <img id="cam-img" alt="Camera">
    <div id="overlay">
      <div><span id="status"></span><strong>Catamaran</strong></div>
      <div class="hud">
        <div class="hud-item"><div class="hud-label">BAT</div><span id="h-bat">--.-V</span></div>
        <div class="hud-item"><div class="hud-label">HDG</div><span id="h-hdg">---°</span></div>
        <div class="hud-item"><div class="hud-label">GPS</div><span id="h-gps">---</span></div>
      </div>
    </div>
  </div>

  <div id="controls">
    <div id="joy-area"><div id="joy-base"><div id="joy-knob"></div></div></div>
    <div id="actions">
      <button id="fire-btn" class="btn">💧 FIRE</button>
      <button id="rtb-btn" class="btn">↩ RETURN</button>
    </div>
  </div>

  <div id="connect">
    <div id="connect-box">
      <h2>Connect</h2>
      <p style="color:#6a7a8a;font-size:14px;margin-bottom:12px">Boat IP address</p>
      <input id="boat-ip" type="text" value="192.168.4.1">
      <button class="primary" onclick="connect()">CONNECT</button>
      <button class="secondary" onclick="connect()">🔍 Auto-Detect</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
